# bp-node-config.ini
http-server-address = 0.0.0.0:8888
p2p-listen-endpoint = 0.0.0.0:9876
p2p-peer-address = validator-node:9876
p2p-peer-address = api-node:9876
plugin = eosio::chain_api_plugin
plugin = eosio::producer_plugin
plugin = eosio::net_plugin
plugin = eosio::http_plugin
plugin = eosio::resource_monitor_plugin
resource-monitor-interval = 2
resource-monitor-space-threshold = 95
resource-monitor-shutdown-on-threshold-exceeded = true
resource-monitor-warning-interval = 30