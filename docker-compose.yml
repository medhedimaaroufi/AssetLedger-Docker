services:
  bp-node:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=full
      - P2P_PEERS=validator-node:9876 api-node:9876
    ports:
      - "8888:8888"
      - "9876:9876"
    volumes:
      - bp-node-data:/root/.local/share/eosio/nodeos/data
    networks:
      - assetledger-net

  validator-node:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=full
      - P2P_PEERS=bp-node:9876 api-node:9876
      - PRODUCER_NAME=validator
    ports:
      - "8889:8888"
      - "9877:9876"
    volumes:
      - validator-node-data:/root/.local/share/eosio/nodeos/data
    networks:
      - assetledger-net

  api-node:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=api
      - P2P_PEERS=bp-node:9876 validator-node:9876
    ports:
      - "8890:8888"
      - "9878:9876"
    volumes:
      - api-node-data:/root/.local/share/eosio/nodeos/data
    networks:
      - assetledger-net

networks:
  assetledger-net:
    driver: bridge

volumes:
  bp-node-data:
  validator-node-data:
  api-node-data: